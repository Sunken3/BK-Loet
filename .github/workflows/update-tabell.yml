# Hämtar ligatabellen från BITS varje söndag 18:00 svensk tid och committar
# ändringen. Pushen till main får Cloudflare att deploya om sidan.
#
# Kan också köras för hand: Actions-fliken -> "Uppdatera tabell" -> Run workflow.

name: Uppdatera tabell

on:
  schedule:
    # GitHub kör cron i UTC. 16:00 UTC = 18:00 sommartid, 17:00 UTC = 18:00
    # vintertid. Båda körs; steget nedan avbryter den som inte är 18:00 i Sverige.
    - cron: '0 16 * * 0'
    - cron: '0 17 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  uppdatera:
    runs-on: ubuntu-latest
    steps:
      - name: Rätt timme i Sverige?
        id: tid
        run: |
          timme=$(TZ=Europe/Stockholm date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manuell körning — kör oavsett klockslag (just nu $timme:00)."
            echo "kor=ja" >> "$GITHUB_OUTPUT"
          elif [ "$timme" = "18" ]; then
            echo "Klockan är $timme i Sverige — kör."
            echo "kor=ja" >> "$GITHUB_OUTPUT"
          else
            echo "Klockan är $timme i Sverige, inte 18 — hoppar över."
            echo "kor=nej" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.tid.outputs.kor == 'ja'

      - uses: actions/setup-node@v4
        if: steps.tid.outputs.kor == 'ja'
        with:
          node-version: '20'

      - name: Hämta tabellen
        if: steps.tid.outputs.kor == 'ja'
        run: node scripts/update-tabell.js

      - name: Hämta matcher och matchfakta
        if: steps.tid.outputs.kor == 'ja'
        run: node scripts/update-matcher.js

      - name: Committa om något ändrats
        if: steps.tid.outputs.kor == 'ja'
        run: |
          if git diff --quiet data.json matcher.json; then
            echo "Tabellen oförändrad — ingen commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json matcher.json
          git commit -m "Uppdatera tabell och matcher från BITS"
          git push
