<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabell — BK Loet</title>
<meta name="description" content="Serietabellen för BK Loet i Nordallsvenskan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1f4d;
    --navy-deep: #061230;
    --blue: #1d4fc4;
    --blue-bright: #2563eb;
    --gold: #f5c518;
    --gold-soft: #fde68a;
    --red: #dc2626;
    --white: #ffffff;
    --gray-50: #f8f9fc;
    --gray-100: #eef1f6;
    --gray-300: #cbd2dc;
    --gray-500: #6b7280;
    --gray-700: #374151;
    --gray-900: #111827;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--gray-900);
    background: var(--white);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ NAVBAR ============ */
  .navbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--gray-100);
  }
  .nav-container {
    max-width: 1280px; margin: 0 auto; padding: 1rem 2rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  .nav-logo {
    display: flex; align-items: center; gap: 0.75rem;
    text-decoration: none; color: var(--navy);
  }
  .nav-logo-mark { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; }
  .nav-logo-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem; letter-spacing: 0.05em; color: var(--navy);
  }
  .nav-logo-sub {
    font-size: 0.65rem; color: var(--gray-500);
    text-transform: uppercase; letter-spacing: 0.15em;
    display: block; margin-top: -2px;
  }
  .nav-links { display: flex; list-style: none; gap: 2rem; align-items: center; }
  .nav-links a {
    text-decoration: none; color: var(--gray-700);
    font-weight: 500; font-size: 0.9rem; transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--blue); }
  .nav-links a.active { color: var(--blue); }
  .nav-cta {
    background: var(--navy); color: var(--white) !important;
    padding: 0.6rem 1.25rem; border-radius: 6px; transition: background 0.2s;
  }
  .nav-cta:hover { background: var(--blue) !important; color: var(--white) !important; }
  .nav-cta-gold {
    background: var(--gold); color: var(--navy-deep) !important;
    padding: 0.6rem 1.25rem; border-radius: 6px; font-weight: 700;
    transition: background 0.2s;
  }
  .nav-cta-gold:hover { background: var(--gold-soft) !important; color: var(--navy-deep) !important; }
  .nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 0.5rem; }
  .nav-toggle span {
    display: block; width: 24px; height: 2px;
    background: var(--navy); margin: 5px 0; transition: all 0.3s;
  }

  /* ============ PAGE HEADER ============ */
  .page-header {
    background: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy) 100%);
    padding: 8rem 0 4rem;
    text-align: center;
  }
  .page-header .section-eyebrow {
    color: var(--gold); font-size: 0.75rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.2em;
    margin-bottom: 0.75rem; display: inline-block;
  }
  .page-header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.5rem, 5vw, 4rem);
    color: var(--white); line-height: 1; margin-bottom: 1rem;
  }
  .page-header p {
    color: rgba(255,255,255,0.7); font-size: 1.05rem; max-width: 520px; margin: 0 auto;
  }

  /* ============ SECTION ============ */
  section { padding: 6rem 0; }
  .container { max-width: 1280px; margin: 0 auto; padding: 0 2rem; }

  /* ============ TABELL ============ */
  #tabell { background: #f3f4f6; color: #111827; }
  .table-wrapper {
    max-width: 900px; margin: 0 auto;
    background: #ffffff;
    border-radius: 8px; overflow: hidden;
    border: 1px solid #d1d5db;
  }
  .table-header {
    display: flex; justify-content: space-between;
    align-items: center;
    padding: 1.5rem 2rem;
    background: #f9fafb;
    border-bottom: 2px solid #d1d5db;
  }
  .table-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.25rem; letter-spacing: 0.05em;
    color: #111827;
  }
  .table-season { color: #6b7280; font-size: 0.85rem; }
  .league-table { width: 100%; border-collapse: collapse; }
  .league-table th {
    text-align: left; padding: 1rem 1.5rem;
    font-size: 0.8rem; font-weight: 600;
    color: #374151;
    text-transform: uppercase; letter-spacing: 0.1em;
    border-bottom: 2px solid #d1d5db;
  }
  .league-table th:not(:first-child):not(:nth-child(2)) { text-align: center; }
  .league-table td {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid #e5e7eb;
    font-size: 0.95rem;
    color: #111827;
  }
  .league-table td:not(:first-child):not(:nth-child(2)) { text-align: center; }
  .league-table tbody tr:nth-child(1) td { border-bottom: 3px solid #16a34a; }
  .league-table tbody tr:nth-child(6) td { border-bottom: 3px solid #f59e0b; }
  .league-table tbody tr:nth-child(8) td { border-bottom: 3px solid #dc2626; }
  .league-table tbody tr:nth-child(even) { background: #f9fafb; }
  .league-table tbody tr:hover { background: #f3f4f6; }
  .league-table tbody tr.our-team { background: rgba(245, 197, 24, 0.12); }
  .league-table tbody tr.our-team td { font-weight: 700; color: #92670a; }
  .position-cell {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.25rem; color: #374151; width: 60px;
  }
  .promotion-indicator { display: none; }
  .table-legend {
    padding: 1.25rem 2rem;
    background: #f9fafb;
    border-top: 1px solid #e5e7eb;
    font-size: 0.8rem; color: #6b7280;
    display: flex; gap: 1.5rem; flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 0.5rem; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; background: #16a34a; }
  .table-disclaimer {
    text-align: center; margin-top: 1.5rem;
    color: #6b7280; font-size: 0.85rem;
  }

  /* ============ MATCHER (modal) ============ */
  .team-btn {
    background: none; border: 0; padding: 0; margin: 0;
    font: inherit; color: inherit; cursor: pointer;
    text-align: left; text-decoration: underline;
    text-decoration-color: rgba(29, 79, 196, 0.35);
    text-underline-offset: 3px;
  }
  .team-btn:hover, .team-btn:focus-visible { color: var(--blue); }

  .match-modal {
    position: fixed; inset: 0; z-index: 200;
    display: none; align-items: center; justify-content: center;
    padding: 1.5rem;
  }
  .match-modal.open { display: flex; }
  .match-modal-overlay {
    position: absolute; inset: 0;
    background: rgba(6, 18, 48, 0.6);
  }
  .match-modal-box {
    position: relative;
    background: var(--white); border-radius: 14px;
    width: 100%; max-width: 760px;
    max-height: 85vh; overflow-y: auto;
    box-shadow: 0 25px 60px rgba(6, 18, 48, 0.35);
  }
  .match-modal-head {
    position: sticky; top: 0; z-index: 1;
    background: var(--navy); color: var(--white);
    padding: 1.25rem 3.25rem 1.25rem 1.5rem;
    border-radius: 14px 14px 0 0;
  }
  .match-modal-head h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem; letter-spacing: 0.5px; line-height: 1.1;
  }
  .match-modal-sub {
    font-size: 0.85rem; color: var(--gold-soft); margin-top: 0.2rem;
  }
  .match-modal-close {
    position: absolute; top: 1rem; right: 1rem;
    width: 34px; height: 34px; border: 0; border-radius: 50%;
    background: rgba(255, 255, 255, 0.15); color: var(--white);
    font-size: 1.4rem; line-height: 1; cursor: pointer;
  }
  .match-modal-close:hover { background: rgba(255, 255, 255, 0.28); }
  .match-modal-body { padding: 1.5rem; }
  .match-back {
    background: none; border: 0; padding: 0; margin-bottom: 1rem;
    color: var(--blue); font: inherit; font-size: 0.88rem; cursor: pointer;
  }
  .match-back:hover { text-decoration: underline; }

  .match-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
  .match-row {
    width: 100%; display: flex; align-items: center; gap: 0.75rem;
    padding: 0.8rem 1rem; border: 1px solid #e5e7eb; border-radius: 9px;
    background: var(--white); font: inherit; text-align: left; cursor: pointer;
  }
  .match-row:hover, .match-row:focus-visible { border-color: var(--blue); background: #f8faff; }
  .match-row[disabled] { cursor: default; color: var(--gray-500); background: #fbfbfd; }
  .match-row[disabled]:hover { border-color: #e5e7eb; background: #fbfbfd; }
  .match-row-date { font-size: 0.8rem; color: var(--gray-500); width: 68px; flex-shrink: 0; }
  .match-row-teams { flex: 1; font-size: 0.92rem; }
  .match-row-teams .mr-win { font-weight: 700; }
  .match-row-score {
    font-family: 'Bebas Neue', sans-serif; font-size: 1.15rem;
    letter-spacing: 0.5px; color: var(--navy); flex-shrink: 0;
  }
  .match-group-title {
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;
    color: var(--gray-500); margin: 1.25rem 0 0.6rem;
  }
  .match-group-title:first-child { margin-top: 0; }

  .match-score-head {
    display: flex; align-items: center; justify-content: center;
    gap: 1.25rem; padding: 1rem 0 1.25rem; text-align: center;
  }
  .match-score-head .ms-team { flex: 1; font-size: 0.95rem; font-weight: 600; }
  .match-score-head .ms-score {
    font-family: 'Bebas Neue', sans-serif; font-size: 2.4rem;
    color: var(--navy); letter-spacing: 1px; white-space: nowrap;
  }
  .match-meta {
    font-size: 0.82rem; color: var(--gray-500);
    text-align: center; padding-bottom: 1.25rem;
    border-bottom: 1px solid #e5e7eb; margin-bottom: 1.25rem;
  }
  .match-sub-title {
    font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem;
    letter-spacing: 0.5px; color: var(--navy); margin: 1.5rem 0 0.6rem;
  }
  .match-sub-title:first-child { margin-top: 0; }
  .match-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .match-table th {
    text-align: center; padding: 0.5rem 0.4rem;
    background: var(--gray-100); color: var(--gray-700);
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px;
    border-bottom: 1px solid #e5e7eb;
  }
  .match-table th:first-child, .match-table td:first-child { text-align: left; }
  .match-table td {
    padding: 0.5rem 0.4rem; text-align: center;
    border-bottom: 1px solid #f0f2f5;
  }
  .match-table tbody tr:last-child td { border-bottom: 0; }
  .match-table .mt-total { font-weight: 700; color: var(--navy); }
  .match-table .mt-zero { color: var(--gray-300); }
  .match-empty { color: var(--gray-500); font-size: 0.9rem; padding: 0.5rem 0; }

  @media (max-width: 600px) {
    .match-modal { padding: 0; }
    .match-modal-box { max-width: none; max-height: 100vh; height: 100%; border-radius: 0; }
    .match-modal-head { border-radius: 0; }
    .match-modal-body { padding: 1.1rem; }
    .match-row { padding: 0.7rem 0.75rem; gap: 0.5rem; }
    .match-row-date { width: 56px; font-size: 0.74rem; }
    .match-row-teams { font-size: 0.84rem; }
    .match-score-head .ms-score { font-size: 1.8rem; }
    .match-table { font-size: 0.78rem; }
    .match-table th, .match-table td { padding: 0.45rem 0.25rem; }
  }

  /* ============ FOOTER ============ */
  footer {
    background: #030814; color: rgba(255,255,255,0.7);
    padding: 4rem 0 2rem;
  }
  .footer-grid {
    display: grid; grid-template-columns: 2fr 1fr 1fr;
    gap: 3rem; margin-bottom: 3rem;
  }
  .footer-brand { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .footer-brand-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem; color: var(--white); letter-spacing: 0.05em;
  }
  .footer-tagline { color: rgba(255,255,255,0.5); font-size: 0.9rem; max-width: 320px; line-height: 1.6; }
  .footer-col h4 {
    color: var(--white); font-size: 0.85rem;
    text-transform: uppercase; letter-spacing: 0.1em;
    margin-bottom: 1rem; font-weight: 600;
  }
  .footer-col ul { list-style: none; }
  .footer-col li { margin-bottom: 0.5rem; }
  .footer-col a { color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
  .footer-col a:hover { color: var(--gold); }
  .footer-bottom {
    border-top: 1px solid rgba(255,255,255,0.08); padding-top: 2rem;
    display: flex; justify-content: space-between; align-items: center;
    color: rgba(255,255,255,0.4); font-size: 0.85rem; flex-wrap: wrap; gap: 1rem;
  }

  /* ============ Loading state ============ */
  .loading {
    min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
    color: var(--gray-500); font-size: 0.95rem;
  }
  .error-box {
    max-width: 600px; margin: 6rem auto; padding: 2rem;
    background: #fee2e2; border-left: 4px solid var(--red);
    border-radius: 8px; color: #7f1d1d;
  }

  /* ============ MOBILE ============ */
  @media (max-width: 968px) {
    .nav-links {
      position: fixed; top: 73px; left: 0; right: 0;
      background: var(--white); flex-direction: column;
      padding: 2rem; gap: 1.5rem;
      border-bottom: 1px solid var(--gray-100);
      transform: translateY(-150%); transition: transform 0.3s;
    }
    .nav-links.open { transform: translateY(0); }
    .nav-toggle { display: block; }
  }
  .table-scroll-wrapper {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  @media (max-width: 600px) {
    section { padding: 4rem 0; }
    .container, .nav-container { padding-left: 1.25rem; padding-right: 1.25rem; }
    .footer-grid { grid-template-columns: 1fr; gap: 2rem; }
    .footer-bottom { flex-direction: column; text-align: center; }
    .league-table th, .league-table td { padding: 0.7rem 0.4rem; font-size: 0.78rem; }
    .league-table td:nth-child(2), .league-table th:nth-child(2) {
      max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .position-cell { width: 32px; font-size: 1rem; }
  }
</style>
</head>
<body>

<div id="app">
  <div class="loading">Laddar...</div>
</div>

<script>
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function emblemSvg(extraClass = '') {
    return `<img src="images/logotyper/BK LOET EMBLEM_Modern.svg" alt="BK Loet emblem" class="${extraClass}" style="width:100%;height:100%;object-fit:contain;">`;
  }

  function renderNavbar(data) {
    return `
      <nav class="navbar">
        <div class="nav-container">
          <a href="index.html" class="nav-logo">
            <div class="nav-logo-mark">${emblemSvg()}</div>
            <div>
              <div class="nav-logo-text">${escapeHtml(data.klubb.namn)}</div>
              <span class="nav-logo-sub">Bowlingklubb · ${escapeHtml(data.klubb.ort)}</span>
            </div>
          </a>
          <button class="nav-toggle" id="navToggle" aria-label="Meny">
            <span></span><span></span><span></span>
          </button>
          <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Startsida</a></li>
            <li><a href="spelare.html">Våra spelare</a></li>
            <li><a href="sponsorer.html">Sponsorer</a></li>
            <li><a href="tabell.html" class="active">Tabell</a></li>
            <li><a href="index.html#medlem" class="nav-cta-gold">Bli stödmedlem</a></li>
            <li><a href="index.html#kontakt" class="nav-cta">Kontakta oss</a></li>
          </ul>
        </div>
      </nav>`;
  }

  function renderFooter(data) {
    return `
      <footer>
        <div class="container">
          <div class="footer-grid">
            <div>
              <div class="footer-brand">
                <div style="width:36px;height:36px;">${emblemSvg()}</div>
                <div class="footer-brand-text">${escapeHtml(data.klubb.namn)}</div>
              </div>
              <p class="footer-tagline">Bowlingklubb i ${escapeHtml(data.klubb.ort)} · ${escapeHtml(data.klubb.serie)}.</p>
            </div>
            <div class="footer-col">
              <h4>Klubben</h4>
              <ul>
                <li><a href="spelare.html">Spelare</a></li>
                <li><a href="sponsorer.html">Sponsorer</a></li>
                <li><a href="tabell.html">Tabell</a></li>
                <li><a href="index.html#kontakt">Kontakta oss</a></li>
              </ul>
            </div>
            <div class="footer-col">
              <h4>Följ oss</h4>
              <ul>
                <li><a href="${escapeHtml(data.kontaktsektion.instagram_url)}" target="_blank" rel="noopener">Instagram</a></li>
                <li><a href="${escapeHtml(data.kontaktsektion.facebook_url)}" target="_blank" rel="noopener">Facebook</a></li>
              </ul>
            </div>
          </div>
          <div class="footer-bottom">
            <div>© ${new Date().getFullYear()} ${escapeHtml(data.klubb.namn)}. Alla rättigheter förbehållna.</div>
            <div>Bowlingklubb · ${escapeHtml(data.klubb.ort)} · Norrbotten</div>
          </div>
        </div>
      </footer>`;
  }

  function renderTable(data) {
    const rows = data.tabell.lag.map((lag, i) => {
      const pos = i + 1;
      const isOurs = lag.namn === data.klubb.namn;
      const inPromotion = pos <= data.tabell.kvalplatser;
      const indicator = inPromotion ? '<span class="promotion-indicator"></span>' : '';
      return `
        <tr class="${isOurs ? 'our-team' : ''}">
          <td class="position-cell">${indicator}${pos}</td>
          <td><button type="button" class="team-btn js-lag" data-lag="${escapeHtml(lag.namn)}"
                aria-label="Visa matcher för ${escapeHtml(lag.namn)}">${escapeHtml(lag.namn)}</button></td>
          <td>${lag.matcher}</td>
          <td>${lag.vinster}</td>
          <td>${lag.oavgjorda}</td>
          <td>${lag.forluster}</td>
          <td>${lag.skillnad}</td>
          <td>${lag.poang}</td>
        </tr>`;
    }).join('');

    return `
      <section id="tabell">
        <div class="container">
          <div class="table-scroll-wrapper"><div class="table-wrapper">
            <div class="table-header">
              <div class="table-title">${escapeHtml(data.tabell.titel)}</div>
              <div class="table-season">${escapeHtml(data.tabell.saesong)}</div>
            </div>
            <table class="league-table">
              <thead><tr><th>#</th><th>Lag</th><th>M</th><th>V</th><th>O</th><th>F</th><th>+/−</th><th>P</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
            <div class="table-legend">
              <div class="legend-item"><span class="legend-dot"></span> Kvalplats till Elitserien</div>
              <div class="legend-item">M = Matcher · V = Vunna · O = Oavgjorda · F = Förlorade · P = Poäng</div>
              <div class="legend-item">Klicka på ett lag för att se deras matcher</div>
            </div>
          </div></div>
          <div class="table-disclaimer">Tabellen uppdaterad: ${escapeHtml(data.tabell.uppdaterad)} · <a href="https://bits.swebowl.se/seriespel" target="_blank" rel="noopener" style="color:#6b7280;text-decoration:underline;">bits.swebowl.se</a></div>
        </div>
      </section>`;
  }

  function renderMatchModal() {
    return `
      <div class="match-modal" id="matchModal" aria-hidden="true">
        <div class="match-modal-overlay" data-close></div>
        <div class="match-modal-box" role="dialog" aria-modal="true" aria-labelledby="matchModalTitle">
          <div class="match-modal-head">
            <h3 id="matchModalTitle">Matcher</h3>
            <div class="match-modal-sub" id="matchModalSub"></div>
            <button class="match-modal-close" type="button" data-close aria-label="Stäng">&times;</button>
          </div>
          <div class="match-modal-body" id="matchModalBody"></div>
        </div>
      </div>`;
  }

  // "2026-09-26" -> "26/9"
  function kortDatum(iso) {
    const [, m, d] = (iso || '').split('-');
    return m && d ? `${Number(d)}/${Number(m)}` : '';
  }

  function attachMatchModal() {
    const modal = document.getElementById('matchModal');
    if (!modal) return;

    const titleEl = modal.querySelector('#matchModalTitle');
    const subEl = modal.querySelector('#matchModalSub');
    const bodyEl = modal.querySelector('#matchModalBody');

    let matchData = null;      // matcher.json, hämtas vid första klicket
    let laddar = null;         // pågående hämtning, så dubbelklick inte ger två anrop
    let lastFocus = null;

    function open() {
      lastFocus = document.activeElement;
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      modal.querySelector('.match-modal-close').focus();
    }
    function close() {
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }

    function hamtaMatcher() {
      if (matchData) return Promise.resolve(matchData);
      if (!laddar) {
        laddar = fetch('matcher.json?v=' + Date.now())
          .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
          .then(json => { matchData = json; return json; })
          .catch(err => { laddar = null; throw err; });
      }
      return laddar;
    }

    function visaLag(lagnamn) {
      titleEl.textContent = lagnamn;
      subEl.textContent = 'Matcher';
      bodyEl.innerHTML = '<div class="match-empty">Laddar matcher…</div>';
      open();

      hamtaMatcher().then(data => {
        const egna = data.matcher.filter(m => m.hemma === lagnamn || m.borta === lagnamn);
        const spelade = egna.filter(m => m.spelad);
        const kommande = egna.filter(m => !m.spelad);

        if (egna.length === 0) {
          bodyEl.innerHTML = '<div class="match-empty">Inga matcher hittades för det här laget.</div>';
          return;
        }

        subEl.textContent =
          `${spelade.length} spelade · ${kommande.length} kommande`;

        const rad = (m) => {
          const hemmaVann = m.spelad && m.hemmaPoang > m.bortaPoang;
          const bortaVann = m.spelad && m.bortaPoang > m.hemmaPoang;
          const teams =
            `<span class="${hemmaVann ? 'mr-win' : ''}">${escapeHtml(m.hemma)}</span>` +
            ` – ` +
            `<span class="${bortaVann ? 'mr-win' : ''}">${escapeHtml(m.borta)}</span>`;
          const score = m.spelad
            ? `${m.hemmaPoang}–${m.bortaPoang}`
            : (m.tid || '');
          // Bara spelade matcher har matchfakta att visa.
          const kanOppnas = m.spelad && m.spelare;
          return `
            <li>
              <button type="button" class="match-row js-match" data-id="${m.id}" ${kanOppnas ? '' : 'disabled'}>
                <span class="match-row-date">${kortDatum(m.datum)}</span>
                <span class="match-row-teams">${teams}</span>
                <span class="match-row-score">${escapeHtml(score)}</span>
              </button>
            </li>`;
        };

        let html = '';
        if (spelade.length) {
          html += `<div class="match-group-title">Spelade matcher</div>
                   <ul class="match-list">${spelade.map(rad).join('')}</ul>`;
        }
        if (kommande.length) {
          html += `<div class="match-group-title">Kommande matcher</div>
                   <ul class="match-list">${kommande.map(rad).join('')}</ul>`;
        }
        bodyEl.innerHTML = html;
      }).catch(() => {
        bodyEl.innerHTML =
          '<div class="match-empty">Kunde inte ladda matcherna just nu. Försök igen senare.</div>';
      });
    }

    function spelarTabell(spelare) {
      if (!spelare || !spelare.length) return '<div class="match-empty">Inga spelaruppgifter.</div>';
      const rader = spelare.map(p => {
        const serier = p.serier
          .map(s => `<td class="${s ? '' : 'mt-zero'}">${s || '–'}</td>`)
          .join('');
        return `
          <tr>
            <td>${escapeHtml(p.namn)}</td>
            ${serier}
            <td class="mt-total">${p.total}</td>
            <td>${p.banpoang}</td>
          </tr>`;
      }).join('');
      return `
        <table class="match-table">
          <thead><tr><th>Spelare</th><th>S1</th><th>S2</th><th>S3</th><th>S4</th><th>Tot</th><th>BP</th></tr></thead>
          <tbody>${rader}</tbody>
        </table>`;
    }

    function visaMatch(id, tillbakaTillLag) {
      const m = matchData && matchData.matcher.find(x => String(x.id) === String(id));
      if (!m) return;

      titleEl.textContent = `${m.hemma} – ${m.borta}`;
      subEl.textContent = [kortDatum(m.datum), m.tid, m.hall].filter(Boolean).join(' · ');

      const serieRader = (m.serier || []).map(s => `
        <tr>
          <td>Serie ${s.serie}</td>
          <td>${s.hemmaKaglor}</td>
          <td>${s.bortaKaglor}</td>
          <td>${s.hemmaPoang}</td>
          <td>${s.bortaPoang}</td>
        </tr>`).join('');

      bodyEl.innerHTML = `
        <button type="button" class="match-back js-tillbaka">← Alla matcher för ${escapeHtml(tillbakaTillLag)}</button>

        <div class="match-score-head">
          <div class="ms-team">${escapeHtml(m.hemma)}</div>
          <div class="ms-score">${m.hemmaPoang}–${m.bortaPoang}</div>
          <div class="ms-team">${escapeHtml(m.borta)}</div>
        </div>
        <div class="match-meta">
          ${m.hemmaKaglor} – ${m.bortaKaglor} käglor
          ${m.oljeprofil ? ' · ' + escapeHtml(m.oljeprofil) : ''}
          ${m.omgang ? ' · Omgång ' + m.omgang : ''}
        </div>

        ${serieRader ? `
          <div class="match-sub-title">Serier</div>
          <table class="match-table">
            <thead><tr><th></th><th>Käglor H</th><th>Käglor B</th><th>Poäng H</th><th>Poäng B</th></tr></thead>
            <tbody>${serieRader}</tbody>
          </table>` : ''}

        <div class="match-sub-title">${escapeHtml(m.hemma)}</div>
        ${spelarTabell(m.spelare && m.spelare.hemma)}

        <div class="match-sub-title">${escapeHtml(m.borta)}</div>
        ${spelarTabell(m.spelare && m.spelare.borta)}

        <div class="match-meta" style="border:0;margin:1.5rem 0 0;padding:0;">
          <a href="https://bits.swebowl.se/match-detail?matchid=${m.id}" target="_blank" rel="noopener"
             style="color:#6b7280;text-decoration:underline;">Matchfakta på bits.swebowl.se</a>
        </div>`;

      bodyEl.scrollTop = 0;
      modal.querySelector('.match-modal-box').scrollTop = 0;
    }

    // Vilket lag modalen öppnades från — används av "tillbaka".
    let aktivtLag = null;

    document.querySelectorAll('.js-lag').forEach(btn => {
      btn.addEventListener('click', () => {
        aktivtLag = btn.dataset.lag;
        visaLag(aktivtLag);
      });
    });

    bodyEl.addEventListener('click', (e) => {
      const matchBtn = e.target.closest('.js-match');
      if (matchBtn && !matchBtn.disabled) {
        visaMatch(matchBtn.dataset.id, aktivtLag);
        return;
      }
      if (e.target.closest('.js-tillbaka')) visaLag(aktivtLag);
    });

    modal.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', close));
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && modal.classList.contains('open')) close();
    });
  }

  function showError(message, details) {
    document.getElementById('app').innerHTML = `
      <div class="error-box">
        <h3>Kunde inte ladda sidan</h3>
        <p>${escapeHtml(message)}</p>
        ${details ? `<p style="margin-top:1rem;font-size:0.9rem;"><code>${escapeHtml(details)}</code></p>` : ''}
      </div>`;
  }

  async function init() {
    try {
      const res = await fetch('data.json?v=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      document.title = `Tabell — ${data.klubb.namn}`;

      document.getElementById('app').innerHTML =
        renderNavbar(data) +
        `<div class="page-header">
          <span class="section-eyebrow">${escapeHtml(data.klubb.serie)}</span>
          <h1>Tabellen</h1>
        </div>` +
        renderTable(data) +
        renderFooter(data) +
        renderMatchModal();

      attachMatchModal();

      const toggle = document.getElementById('navToggle');
      const links = document.getElementById('navLinks');
      if (toggle && links) {
        toggle.addEventListener('click', () => links.classList.toggle('open'));
        links.querySelectorAll('a').forEach(a => a.addEventListener('click', () => links.classList.remove('open')));
      }
    } catch (err) {
      showError('Kontrollera att filen data.json finns och har giltigt JSON-format.', err.message);
      console.error(err);
    }
  }

  init();
</script>
</body>
</html>
